<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banco Imobiliário de Paraú</title><style>body{font-family:Arial;background:#edf1f4;margin:0;color:#17212b}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:white;border-radius:18px;padding:28px;box-shadow:0 8px 30px #0002}h1{margin-top:0}input,button{font-size:16px;padding:12px;border-radius:9px;border:1px solid #bbb;margin:5px}button{cursor:pointer;background:#173b68;color:white;border:0}.room{margin-top:20px;padding:15px;background:#f4f7fa;border-radius:12px}.ok{color:#18733d;font-weight:bold}.err{color:#a32121}</style></head><body><div class="wrap"><div class="card"><h1>Banco Imobiliário de Paraú</h1><p class="ok">Servidor online.</p><p>Crie uma sala ou entre usando o código de um amigo.</p><input id="playerName" placeholder="Seu nome" maxlength="18"><br><button onclick="createRoom()">Criar sala</button><br><input id="roomCode" placeholder="Código da sala" maxlength="5"><button onclick="joinRoom()">Entrar</button><div id="out" class="room">Aguardando...</div></div></div><script>const out=document.getElementById('out');const playerName=document.getElementById('playerName');const roomCode=document.getElementById('roomCode');async function req(u,b){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function createRoom(){try{const n=playerName.value.trim();if(!n)throw Error('Digite seu nome.');let j=await req('/api/create',{name:n});localStorage.parauOnline=JSON.stringify({code:j.room.code,token:j.token,playerId:j.playerId});out.innerHTML='<b>Sala criada:</b> '+j.room.code+'<br>Compartilhe este código com seus amigos.'}catch(e){out.innerHTML='<span class="err">'+e.message+'</span>'}}async function joinRoom(){try{const n=playerName.value.trim();const c=roomCode.value.trim().toUpperCase();if(!n)throw Error('Digite seu nome.');if(!c)throw Error('Digite o código da sala.');let j=await req('/api/join',{name:n,code:c});localStorage.parauOnline=JSON.stringify({code:j.room.code,token:j.token,playerId:j.playerId});out.innerHTML='<b>Você entrou na sala '+j.room.code+'</b><br>Jogadores: '+j.room.players.map(x=>x.name).join(', ')}catch(e){out.innerHTML='<span class="err">'+e.message+'</span>'}}</script></body></html>
